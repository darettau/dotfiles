backend = "glx";
vsync = true;

# Shadows
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#000000";
shadow-exclude = [
  "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Corners
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'polybar'"
];
round-borders = 1;

# Fading (superseded by the animations block below for open/close;
# kept for anything animations doesn't cover, e.g. menus)
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

# Animations
animations = (
  # scale origin is the top-left corner, so offset by half the shrinkage to grow from the center.
  {
    triggers = ["open", "show"];
    opacity = {
      curve = "cubic-bezier(0.16,1,0.3,1)";
      duration = 0.3;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.16,1,0.3,1)";
      duration = 0.3;
      start = 0.96;
      end = 1;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) * window-width / 2";
    offset-y = "(1 - scale-y) * window-height / 2";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["close", "hide"];
    opacity = {
      curve = "cubic-bezier(0.4,0,0.6,1)";
      duration = 0.22;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.4,0,0.6,1)";
      duration = 0.22;
      start = 1;
      end = 0.96;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) * window-width / 2";
    offset-y = "(1 - scale-y) * window-height / 2";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  # offset-* are relative offsets, not absolute coordinates: they must end at 0.
  {
    triggers = ["geometry"];
    scale-x = {
      curve = "cubic-bezier(0.16,1,0.3,1)";
      duration = 0.3;
      start = "window-width-before / window-width";
      end = 1;
    };
    scale-y = {
      curve = "cubic-bezier(0.16,1,0.3,1)";
      duration = 0.3;
      start = "window-height-before / window-height";
      end = 1;
    };
    offset-x = {
      curve = "cubic-bezier(0.16,1,0.3,1)";
      duration = 0.3;
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0.16,1,0.3,1)";
      duration = 0.3;
      start = "window-y-before - window-y";
      end = 0;
    };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
);

# Opacity
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
focus-exclude = [ "class_g = 'Rofi'", "class_g = 'i3lock'" ];

# Blur disabled — dual_kawase + animations was too heavy on the nvidia glx backend
# and caused the stutter. Re-enable if you want the blurred-transparency look back.
# blur: {
#   method = "dual_kawase";
#   strength = 6;
# }
# blur-background = true;

# General
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

wintypes:
{
  dock = { shadow = false; }
  desktop = { shadow = false; }
  popup_menu = { opacity = 1.0; }
  dropdown_menu = { opacity = 1.0; }
};
